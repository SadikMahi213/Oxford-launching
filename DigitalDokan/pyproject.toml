[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaldokan"
version = "1.0.0"
description = "Offline-first Grocery/Super Shop POS for Bangladesh (Windows desktop)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
reports = ["openpyxl>=3.1", "reportlab>=4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
