# ─────────────────────────────────────────────────────
# ArbiGrow Frontend — Nginx Configuration
# ─────────────────────────────────────────────────────
# In production, set the API upstream to the backend service.
# ─────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;

    client_max_body_size 15M;

    # Docker DNS resolver — prevents stale DNS cache after container restart
    resolver 127.0.0.11 valid=10s;

    # ── Static files ───────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Asset caching (fingerprinted by Vite) ───────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ── API proxy ───────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── HTML pages ──────────────────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://oxfordfinancialads.com https://coin-images.coingecko.com https://assets.coingecko.com https://img.youtube.com https://flagcdn.com https://cdn.prod.website-files.com https://s3.us-east-005.backblazeb2.com https://placehold.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://www.youtube.com; frame-src 'self' https://www.youtube.com; connect-src 'self' https://api.binance.com wss://stream.binance.com:9443; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # ── SPA fallback ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://oxfordfinancialads.com https://coin-images.coingecko.com https://assets.coingecko.com https://img.youtube.com https://flagcdn.com https://cdn.prod.website-files.com https://s3.us-east-005.backblazeb2.com https://placehold.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://www.youtube.com; frame-src 'self' https://www.youtube.com; connect-src 'self' https://api.binance.com wss://stream.binance.com:9443; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }
}
