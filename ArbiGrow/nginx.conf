# ─────────────────────────────────────────────────────
# ArbiGrow Frontend — Nginx Configuration
# ─────────────────────────────────────────────────────
# In production, set the API upstream to the backend service.
# ─────────────────────────────────────────────────────

upstream backend {
    server backend:8000;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;

    client_max_body_size 15M;

    # ── Static files ───────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ───────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" always;

    # ── Gzip ────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Asset caching (fingerprinted by Vite) ───────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy ───────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Invoice PDF storage ────────────────────────────
    location /storage/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ── No cache for HTML (SPA updates) ────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ── SPA fallback ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
