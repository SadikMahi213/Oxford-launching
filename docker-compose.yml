# ─────────────────────────────────────────────────────
# Oxford Financial Ads — Docker Compose
# ─────────────────────────────────────────────────────
# Start all services:
#   docker compose up -d
#
# Rebuild after code changes:
#   docker compose up -d --build
#
# Stop everything:
#   docker compose down
# ─────────────────────────────────────────────────────

name: arbigrow

services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: arbigrow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arbigrow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (FastAPI) ───────────────────────────────
  backend:
    build:
      context: ./arbigrow-fastapi
      target: prod
    container_name: arbigrow-backend
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    env_file: /root/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/arbigrow
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 7200
      ALLOWED_ORIGINS: '["https://oxfordfinancialads.com","http://oxfordfinancialads.com","http://localhost","http://localhost:80"]'
      APP_ENV: production
      LOG_LEVEL: INFO
      FRONTEND_DOMAIN: https://oxfordfinancialads.com
      DB_SSL_REQUIRED: "false"
      AUTO_ROI_ENABLED: "true"
      AUTO_ROI_POLL_SECONDS: 21600
    depends_on:
      postgres:
        condition: service_healthy

  # ── Database Migration + Seed ──────────────────────
  migrate:
    build:
      context: ./arbigrow-fastapi
      target: base
    container_name: arbigrow-migrate
    command: >
      sh -c "
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Seeding database...' &&
        python seed.py &&
        echo 'Done!'
      "
    env_file: /root/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/arbigrow
      ALGORITHM: HS256
      ALLOWED_ORIGINS: '["https://oxfordfinancialads.com","http://oxfordfinancialads.com","http://localhost","http://localhost:80"]'
      APP_ENV: production
      LOG_LEVEL: INFO
      FRONTEND_DOMAIN: https://oxfordfinancialads.com
      DB_SSL_REQUIRED: "false"
      AUTO_ROI_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (React + Vite) ────────────────────────
  frontend:
    build:
      context: ./ArbiGrow
      target: ${FRONTEND_TARGET:-prod}
      args:
        VITE_BACKEND_URL: http://backend:8000
    container_name: arbigrow-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  # ── Monitoring (Uptime Kuma) ─────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    container_name: arbigrow-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  postgres_data:
  uptime_kuma_data:
